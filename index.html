<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>School Menus</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>School Menus</h1>
  <p class="subtitle">Today's offerings at a glance — click any day to expand</p>

  <!-- Today's auto-shown menu -->
  <h2 id="today-heading">Today</h2>
  <div id="today-card" class="today-card"></div>

  <!-- Clickable days -->
  <h2>This Week</h2>
  <div id="days"></div>

  <script src="menus.js"></script>
  <script>
    const days = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"];
    const today = new Date().toLocaleDateString("en-US", { weekday: "long" });

    // --- Build the "Today" card ---
    const todayCard = document.getElementById("today-card");
    const todayHeading = document.getElementById("today-heading");

    if (days.includes(today)) {
      todayHeading.textContent = "Today — " + today;
      todayCard.innerHTML = `
        <div>
          <p class="label">🍽️ Cafeteria</p>
          <ul>${(cafeteriaMenu[today] || []).map(i => `<li>${i}</li>`).join("") || "<li>Closed</li>"}</ul>
        </div>
        <div>
          <p class="label">🛒 Shop</p>
          <ul>${(shopMenu[today] || []).map(i => `<li>${i}</li>`).join("") || "<li>Closed</li>"}</ul>
        </div>
      `;
    } else {
      todayHeading.textContent = "Today — " + today;
      todayCard.innerHTML = `<p>No menus today. Enjoy your weekend! 🎉</p>`;
    }

    // --- Build the clickable day list ---
    const daysContainer = document.getElementById("days");

    days.forEach(day => {
      const isToday = day === today;

      const button = document.createElement("button");
      button.className = "day-button" + (isToday ? " today open" : "");
      button.innerHTML = `${day}${isToday ? " (Today)" : ""}<span class="arrow">▶</span>`;

      const content = document.createElement("div");
      content.className = "day-content" + (isToday ? " open" : "");
      content.innerHTML = `
        <div>
          <h4>🍽️ Cafeteria</h4>
          <ul>${(cafeteriaMenu[day] || []).map(i => `<li>${i}</li>`).join("") || "<li>—</li>"}</ul>
        </div>
        <div>
          <h4>🛒 Shop</h4>
          <ul>${(shopMenu[day] || []).map(i => `<li>${i}</li>`).join("") || "<li>—</li>"}</ul>
        </div>
      `;

      button.addEventListener("click", () => {
        button.classList.toggle("open");
        content.classList.toggle("open");
      });

      daysContainer.appendChild(button);
      daysContainer.appendChild(content);
    });
  </script>
</body>
</html>
