<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>School Menus</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>School Menus</h1>
  <p class="subtitle">Today's cafeteria and shop offerings</p>

  <h2>🍽️ Cafeteria Menu</h2>
  <div id="cafeteria"></div>

  <h2>🛒 Shop Menu</h2>
  <div id="shop"></div>

  <script src="menus.js"></script>
  <script>
    const days = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"];
    const today = new Date().toLocaleDateString("en-US", { weekday: "long" });

    function render(containerId, menu) {
      const container = document.getElementById(containerId);
      container.innerHTML = "";

      days.forEach(day => {
        const items = menu[day] || [];
        const isToday = day === today;

        const div = document.createElement("div");
        div.className = "day" + (isToday ? " today" : "");
        div.innerHTML = `
          <h3>${day}${isToday ? " (Today)" : ""}</h3>
          <ul>${items.map(i => `<li>${i}</li>`).join("")}</ul>
        `;
        container.appendChild(div);
      });
    }

    render("cafeteria", cafeteriaMenu);
    render("shop", shopMenu);
  </script>
</body>
</html>
