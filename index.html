<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>School Menus</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>School Menus</h1>
      <p>Cafeteria &amp; shop offerings, updated daily</p>
    </header>

    <!-- TODAY -->
    <section id="today-section"></section>

    <!-- WEEK -->
    <section class="week-section">
      <h2>This Week</h2>
      <div id="week-list" class="week-list"></div>
    </section>
  </div>

  <script src="menus.js"></script>
  <script>
    const days = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"];
    const today = new Date().toLocaleDateString("en-US", { weekday: "long" });

    // Cafeteria items: just a list
    const cafeteriaListHtml = (items) => {
      if (!items || items.length === 0) return '<div class="closed">Closed</div>';
      return "<ul>" + items.map(i => `<li>${i}</li>`).join("") + "</ul>";
    };

    // Shop items: split "Name — $Price" and render price on the right
    const shopListHtml = (items) => {
      if (!items || items.length === 0) return '<div class="closed">Closed</div>';
      return "<ul>" + items.map(i => {
        const parts = i.split(" — ");
        if (parts.length === 2) {
          return `<li class="shop-item"><span>${parts[0]}</span><span class="price">${parts[1]}</span></li>`;
        }
        return `<li>${i}</li>`;
      }).join("") + "</ul>";
    };

    // ===== TODAY =====
    const todaySection = document.getElementById("today-section");

    if (days.includes(today)) {
      todaySection.innerHTML = `
        <div class="today-card">
          <span class="today-label">Today</span>
          <h2>${today}</h2>
          <div class="today-grid">
            <div class="section">
              <h3>🍽️ Cafeteria</h3>
              ${cafeteriaListHtml(cafeteriaMenu[today])}
            </div>
            <div class="section">
              <h3>🛒 Shop</h3>
              ${shopListHtml(shopMenu[today])}
            </div>
          </div>
        </div>
      `;
    } else {
      todaySection.innerHTML = `
        <div class="today-card">
          <span class="today-label">Today</span>
          <h2>${today}</h2>
          <div class="closed">No menus today — enjoy your weekend! 🎉</div>
        </div>
      `;
    }

    // ===== WEEK =====
    const weekList = document.getElementById("week-list");

    days.forEach(day => {
      const isToday = day === today;

      const card = document.createElement("div");
      card.className = "day-card" + (isToday ? " today" : "");

      card.innerHTML = `
        <div class="day-header">
          <span>${day}${isToday ? '<span class="badge">Today</span>' : ""}</span>
          <span class="arrow">▶</span>
        </div>
        <div class="day-body">
          <div class="day-body-inner">
            <div>
              <h4>🍽️ Cafeteria</h4>
              ${cafeteriaListHtml(cafeteriaMenu[day])}
            </div>
            <div>
              <h4>🛒 Shop</h4>
              ${shopListHtml(shopMenu[day])}
            </div>
          </div>
        </div>
      `;

      const header = card.querySelector(".day-header");
      header.addEventListener("click", () => card.classList.toggle("open"));

      weekList.appendChild(card);
    });
  </script>
</body>
</html>
